<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENKO — Global Music Company</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Raleway:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--b:#0015CE;--b2:#001AFF;--m:#C3F0C8;--m2:#A8E5B0;--bg:#FAFAF8;--bg2:#F0F0EC;--bg3:#E8E8E3;--txt:#0A0A0A;--txt2:#555;--txt3:#999;--bord:#E0E0DB;--blk:#000}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Raleway',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bord);border-radius:3px}
.osw{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.08em;line-height:1.1}
.ral{font-family:'Raleway',sans-serif;line-height:1.6}
.mono{font-family:'JetBrains Mono',monospace}
button{cursor:pointer;font-family:inherit}

/* HEADER */
.header{position:sticky;top:0;z-index:100;background:rgba(250,250,248,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--bord)}
.header-inner{display:flex;justify-content:space-between;align-items:center;padding:16px 48px;max-width:1400px;margin:0 auto}
.logo{cursor:pointer;font-size:28px;letter-spacing:.15em;border:none;background:none;color:var(--txt)}
nav{display:flex;gap:4px;align-items:center}
.nav-btn{padding:8px 16px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--txt3);font-family:'Raleway',sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .25s;font-weight:400}
.nav-btn:hover{color:var(--txt)}.nav-btn.act{color:var(--b);border-bottom-color:var(--b);font-weight:600}
.lang-wrap{display:flex}
.lang-btn{padding:6px 12px;border:1px solid var(--bord);font-family:'Raleway',sans-serif;font-size:10px;letter-spacing:.15em;cursor:pointer;background:transparent;color:var(--txt3);font-weight:400;transition:all .2s}
.lang-btn.act{background:var(--b);color:#fff;border-color:var(--b);font-weight:600}
.lang-btn:first-child{border-radius:4px 0 0 4px}.lang-btn:last-child{border-radius:0 4px 4px 0}

/* SHARED */
.wrap{max-width:1400px;margin:0 auto}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:32px;border-bottom:1px solid var(--bord);padding-bottom:12px}
.sec-title{font-size:13px;color:var(--txt3);letter-spacing:.2em}
.page-label{font-size:11px;color:var(--b);letter-spacing:.15em;text-transform:uppercase;font-weight:500;margin-bottom:8px}
.btn-blue{padding:14px 36px;background:var(--b);color:#fff;border:none;font-family:'Oswald',sans-serif;font-weight:700;font-size:11px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;border-radius:0;transition:all .2s}
.btn-blue:hover{background:var(--b2)}
.btn-outline-w{padding:14px 36px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);font-family:'Oswald',sans-serif;font-weight:700;font-size:11px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;border-radius:0;transition:all .2s}
.btn-outline-w:hover{border-color:#fff;background:rgba(255,255,255,.1)}
.btn-white{padding:14px 36px;background:#fff;color:var(--txt);border:none;font-family:'Oswald',sans-serif;font-weight:700;font-size:11px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;border-radius:0;transition:all .2s}
.btn-white:hover{background:var(--m)}

/* HERO */
.hero{position:relative;min-height:600px;overflow:hidden;background:var(--blk)}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 30%,rgba(0,21,206,.35) 0%,transparent 50%),radial-gradient(ellipse at 80% 70%,rgba(195,240,200,.08) 0%,transparent 55%),linear-gradient(180deg,#000 0%,#050510 100%)}
.hero-pat{position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23ffffff' stroke-opacity='.025'%3E%3Cpath d='M0 0h40v40H0z'/%3E%3C/g%3E%3C/svg%3E")}
.hero-grain{position:absolute;inset:0;opacity:.04;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid rgba(255,255,255,.08)}
.stat-item{padding:28px 24px;text-align:center;border-right:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.3);backdrop-filter:blur(10px)}
.stat-item:last-child{border-right:none}

/* CAROUSEL */
.carousel-wrap{position:relative;overflow:hidden}
.carousel-track{display:flex;transition:transform .5s ease}
.carousel-slide{min-width:100%;position:relative}
.carousel-btn{position:absolute;top:50%;transform:translateY(-50%);background:#fff;border:none;width:52px;height:52px;border-radius:0;font-size:18px;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;transition:all .2s;color:var(--txt)}
.carousel-btn:hover{background:var(--m);transform:translateY(-50%) scale(1.05)}
.carousel-btn.prev{left:0}
.carousel-btn.next{right:0}
.carousel-dots{display:flex;gap:6px;justify-content:center;margin-top:24px}
.carousel-dot{width:24px;height:2px;background:var(--bord);border:none;cursor:pointer;transition:all .2s;border-radius:0}
.carousel-dot.act{background:var(--b);width:48px}

/* SPLIT BLOCK */
.split{display:grid;grid-template-columns:1fr 1fr;min-height:500px}
.split-img{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.split-content{padding:60px 48px;display:flex;flex-direction:column;justify-content:center}

/* ARTIST HERO CAROUSEL */
.artist-slide{min-width:100%;height:520px;position:relative;display:flex}
.artist-slide-img{width:50%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.artist-slide-info{width:50%;padding:60px 48px;display:flex;flex-direction:column;justify-content:center;background:var(--txt)}

/* NEWS CARD */
.news-card{border:1px solid var(--bord);overflow:hidden;cursor:pointer;transition:all .3s}
.news-card:hover{border-color:var(--b);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.06)}
.news-img{height:200px;background:var(--bg2);display:flex;align-items:center;justify-content:center}

/* TRACK CAROUSEL */
.track-item{min-width:180px;margin-right:16px;cursor:pointer;transition:all .3s;flex-shrink:0}
.track-item:hover{transform:translateY(-4px)}
.track-cover{width:180px;height:180px;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}

/* MERCH */
.merch-strip{background:var(--txt);padding:16px 0;overflow:hidden;cursor:pointer}
.merch-inner{display:flex;gap:48px;animation:marquee 20s linear infinite;white-space:nowrap}

/* PARTNER LOGO */
.partner-logo{padding:20px 32px;background:var(--bg2);display:flex;align-items:center;justify-content:center;border-radius:4px;opacity:.5;transition:all .3s}
.partner-logo:hover{opacity:1}

/* CASE CARD */
.case-card{padding:40px 36px;background:#fff;border:1px solid var(--bord);transition:all .3s;cursor:pointer;position:relative;overflow:hidden}
.case-card:hover{border-color:var(--b);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,21,206,.08)}
.case-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--b);transform:scaleX(0);transition:transform .3s}.case-card:hover::after{transform:scaleX(1)}

/* PROD CARD */
.prod-slide{min-width:100%;display:grid;grid-template-columns:1fr 1fr;min-height:400px}
.prod-img{background:var(--bg2);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.prod-info{padding:48px;display:flex;flex-direction:column;justify-content:center;background:#fff}

/* FAQ */
.faq-row{padding:20px 0;border-bottom:1px solid var(--bord);cursor:pointer;transition:all .3s}
.faq-row:hover{padding-left:8px}
.faq-expand{max-height:0;overflow:hidden;transition:max-height .4s ease,opacity .3s;opacity:0}
.faq-row.open .faq-expand{max-height:200px;opacity:1}
.faq-row.open .faq-plus{transform:rotate(45deg);color:var(--b)}
.faq-plus{transition:all .3s;font-size:18px;color:var(--txt3)}

/* TESTIMONIAL */
.testimonial{text-align:center;padding:60px 48px;background:var(--bg)}

/* FORM */
.pill{padding:6px 14px;border-radius:0;border:1px solid var(--bord);color:var(--txt2);font-size:11px;cursor:pointer;transition:all .2s;background:transparent;font-family:'Raleway',sans-serif;display:inline-block}
.pill:hover{border-color:var(--b);color:var(--b)}
input,textarea{width:100%;padding:12px 16px;border-radius:0;border:1px solid var(--bord);background:#fff;color:var(--txt);font-size:14px;outline:none;transition:border .2s;font-family:'Raleway',sans-serif}
input:focus,textarea:focus{border-color:var(--b)}
input::placeholder,textarea::placeholder{color:var(--txt3)}
textarea{resize:vertical}

/* GROWTH CHART */
.growth-wrap{margin-top:8px;padding:20px 0;border-top:1px solid rgba(255,255,255,.08)}
.growth-meta{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.4);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
.growth-svg{width:100%;height:auto;display:block}

/* TEAM CARD */
.team-card{background:var(--bg2);padding:32px 24px;text-align:left;border:1px solid var(--bord);transition:all .25s}
.team-card:hover{background:#fff;border-color:var(--b);transform:translateY(-2px)}
.team-portrait{width:100%;aspect-ratio:1;background:var(--bg3);margin-bottom:16px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.team-portrait::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 60%,rgba(0,21,206,.15) 100%)}

/* IG-STYLE TILE */
.ig-tile{aspect-ratio:1;position:relative;overflow:hidden;cursor:pointer;transition:all .3s}
.ig-tile:hover{transform:scale(.985)}
.ig-tile-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.7) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#fff}

/* PARTNER STRIP */
.partner-strip{background:var(--bg);padding:32px 0;border-top:1px solid var(--bord);border-bottom:1px solid var(--bord);overflow:hidden}
.partner-marquee{display:flex;gap:64px;animation:marquee 35s linear infinite;white-space:nowrap;align-items:center}

/* FOOTER */
.footer{background:var(--txt);color:#fff;padding:48px 48px 24px}
.fgrid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;margin-bottom:40px}
.flink{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:8px;cursor:pointer;transition:color .2s}
.flink:hover{color:#fff}
.fbot{border-top:1px solid rgba(255,255,255,.1);padding-top:16px;display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.2);letter-spacing:.05em}

/* NAV BUTTONS for What We Do */
.wwd-btn{padding:12px 24px;background:transparent;border:1px solid var(--bord);font-family:'Raleway',sans-serif;font-size:12px;color:var(--txt2);cursor:pointer;transition:all .2s;border-radius:2px;text-align:left}
.wwd-btn:hover{border-color:var(--b);color:var(--b)}
.wwd-btn span{display:block;font-size:9px;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}

@media(max-width:900px){
  .header-inner{padding:12px 20px}
  nav{display:none}
  .split{grid-template-columns:1fr}
  .artist-slide{flex-direction:column;height:auto}
  .artist-slide-img,.artist-slide-info{width:100%}
  .stat-grid{grid-template-columns:repeat(3,1fr)}
  .fgrid{grid-template-columns:1fr 1fr}
}
</style>
</head>

  const max=Math.max(...data);
  const pts=data.map((v,i)=>{
    const x=(i/(data.length-1))*(W-PAD*2)+PAD;
    const y=H-((v/max)*(H-30))-PAD;
    return [x,y];
  });
  const polyline=pts.map(p=>p.join(',')).join(' ');
  const area=`M${PAD},${H} L${pts.map(p=>p.join(',')).join(' L')} L${W-PAD},${H} Z`;
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4:2.5}" fill="${color}"/>`).join('');
  return `<svg class="growth-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="gg-${color.replace('#','')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#gg-${color.replace('#','')})"/>
    <polyline points="${polyline}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      ${TESTIMONIALS.map(tx=>`<div style="padding:40px 36px;background:#fff;border:1px solid var(--bord);position:relative">

    <button class="btn-blue" onclick="go('contact')">GET IN TOUCH</button>

}

function pageContact(){
  const faqs=t()?FAQ_UA:FAQ_EN;
  const formHTML=formSent?`<div style="padding:60px 0;text-align:center"><div class="osw" style="font-size:48px;color:var(--b)">✓</div><p class="osw" style="font-size:16px;color:var(--txt);margin-top:16px">${t()?"ДЯКУЄМО":"THANK YOU"}</p><p class="ral" style="font-size:13px;color:var(--txt2);margin-top:8px">${t()?"Ми звʼяжемось найближчим часом.":"We'll get back to you shortly."}</p></div>`:`${[{l:t()?"Імʼя":"Name",ph:t()?"Ваше імʼя":"Your name"},{l:"Email",ph:"your@email.com"},{l:t()?"Тема":"Subject",ph:t()?"Дистрибуція / Синхронізація / Бізнес / Інше":"Distribution / Sync / Business / Other"}].map(f=>`<div style="margin-bottom:20px"><label class="ral" style="font-size:10px;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:6px">${f.l}</label><input placeholder="${f.ph}"></div>`).join('')}<div style="margin-bottom:24px"><label class="ral" style="font-size:10px;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:6px">${t()?"Повідомлення":"Message"}</label><textarea rows="4" placeholder="${t()?"Розкажіть про ваш проєкт...":"Tell us about your project..."}"></textarea></div><button class="btn-blue" onclick="sendForm()" style="width:100%;padding:16px">${t()?"НАДІСЛАТИ":"SEND"}</button>`;

  return `<div class="wrap">
  <section style="padding:48px;border-bottom:1px solid var(--bord)">
    <p class="page-label">${t()?"Звʼязок":"Reach Out"}</p>
    <h1 class="osw" style="font-size:48px;color:var(--txt);margin-bottom:16px">${t()?"КОНТАКТИ":"GET IN TOUCH"}</h1>
  </section>
  <!-- FAQ first -->
  <section style="padding:32px 48px 48px">
    <h2 class="osw" style="font-size:12px;color:var(--txt3);letter-spacing:.2em;padding:12px 0;border-bottom:1px solid var(--bord)">FAQ</h2>
    ${faqs.map((f,i)=>`<div class="faq-row ${expandedFaq===i?'open':''}" onclick="toggleFaq(${i})"><div style="display:flex;justify-content:space-between;align-items:center"><span class="ral" style="font-size:15px;color:var(--txt);font-weight:500">${f.q}</span><span class="osw faq-plus">+</span></div><div class="faq-expand"><p class="ral" style="font-size:14px;color:var(--txt2);line-height:1.7;padding-top:12px;max-width:600px">${f.a}</p></div></div>`).join('')}
  </section>
  <div style="display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--bord)">
    <section style="padding:32px 48px 48px;border-right:1px solid var(--bord)">
      <h2 class="osw" style="font-size:12px;color:var(--txt3);letter-spacing:.2em;padding:12px 0;border-bottom:1px solid var(--bord)">${t()?"ДЕПАРТАМЕНТИ":"DEPARTMENTS"}</h2>
      ${DEPTS.map(d=>`<div style="padding:16px 0;border-bottom:1px solid var(--bord);cursor:pointer;transition:all .2s" onmouseenter="this.style.paddingLeft='8px'" onmouseleave="this.style.paddingLeft='0'"><div style="display:flex;justify-content:space-between;align-items:center"><span class="ral" style="font-size:14px;color:var(--txt);font-weight:500">${L(d.l)}</span><span class="mono" style="font-size:11px;color:var(--b)">${d.e}</span></div><p class="ral" style="font-size:11px;color:var(--txt3);margin:4px 0 0">${L(d.d)}</p></div>`).join('')}
      <div style="margin-top:28px"><h3 class="osw" style="font-size:11px;color:var(--txt3);letter-spacing:.15em;margin-bottom:12px">${t()?"СОЦМЕРЕЖІ":"SOCIAL"}</h3><div style="display:flex;gap:6px;flex-wrap:wrap">${["Instagram","YouTube","TikTok","Spotify","LinkedIn"].map(s=>`<span class="pill">${s}</span>`).join('')}</div></div>
    </section>
    <section style="padding:32px 48px 48px">
      <h2 class="osw" style="font-size:12px;color:var(--txt3);letter-spacing:.2em;padding:12px 0;border-bottom:1px solid var(--bord);margin-bottom:24px">${t()?"НАПИСАТИ":"SEND MESSAGE"}</h2>
      ${formHTML}
    </section>
  </div></div>`;
}

function render(){
  renderNav();
  const app=document.getElementById('app');
  switch(page){
    case 'enko':app.innerHTML=pageEnko();break;
    case 'publishing':app.innerHTML=pagePublishing();break;
    case 'forbusiness':app.innerHTML=pageForBusiness();break;
    case 'contact':app.innerHTML=pageContact();break;
    default:app.innerHTML=pageEnko();
  }
  renderFooter();
}
render();
</script>
